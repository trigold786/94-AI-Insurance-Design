include:
  - infra/docker-compose.infra.yml

services:
  api-server:
    image: nsi-api-server:latest
    ports:
      - "39401:39401"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/nsi_api?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ACTUARY_HTTP_ADDR: actuarial-engine:39402
      ACTUARY_SECRET: ${ACTUARY_SECRET:-}
      SERVER_PORT: "39401"
      LLM_GATEWAY_URL: http://llm-gateway:39404
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:39401}
      WEBCLIENT_API_BASE_URL: ${WEBCLIENT_API_BASE_URL:-http://localhost:39401}
      JWT_SECRET: ${JWT_SECRET:-nsi-dev-jwt-secret-2026}
      SERVICE_SECRET: ${SERVICE_SECRET:-nsi-service-secret-2026}
      ACTUARY_ENGINE_URL: http://actuarial-engine:39402
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      POLICY_CRAWLER_URL: http://policy-crawler:39403
      LOG_SMS_CODE: ${LOG_SMS_CODE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:39401/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  actuarial-engine:
    image: nsi-actuarial-engine:latest
    ports:
      - "39402:39402"
    environment:
      REDIS_URL: redis://redis:6379/0
      ACTUARY_SECRET: ${ACTUARY_SECRET:-}
      SERVER_PORT: "39402"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:39402/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  policy-crawler:
    image: nsi-policy-crawler:latest
    ports:
      - "39403:39403"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/nsi_crawler?sslmode=disable
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://llm-gateway:39404}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      CHROME_ENABLED: "true"
      YT_DLP_COOKIES_FILE: ${YT_DLP_COOKIES_FILE:-}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:39403/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  llm-gateway:
    image: nsi-llm-gateway:latest
    ports:
      - "39404:39404"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/nsi_llm?sslmode=disable
      SERVER_PORT: "39404"
      ADMIN_USER: ${ADMIN_USERNAME:-admin}
      ADMIN_PASS: ${ADMIN_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:39404/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db-init:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    entrypoint: >
      sh -c "
        until pg_isready -h postgres -U postgres; do sleep 1; done;
        psql -h postgres -U postgres -c 'CREATE DATABASE nsi_api;' 2>/dev/null || true;
        psql -h postgres -U postgres -c 'CREATE DATABASE nsi_crawler;' 2>/dev/null || true;
        psql -h postgres -U postgres -c 'CREATE DATABASE nsi_llm;' 2>/dev/null || true;
      "
    depends_on:
      postgres:
        condition: service_healthy

  db-migrate:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ./services/api-server/migrations:/migrations/api:ro
      - ./services/policy-crawler/migrations:/migrations/crawler:ro
      - ./services/llm-gateway/migrations:/migrations/llm:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
