syntax = "proto3";
package actuarial;
option go_package = "github.com/trigold786/94-AI-Insurance-Design/actuarial-engine/proto";

service ActuarialEngine {
  rpc CalculatePlan(PlanRequest) returns (PlanResponse);
}

message PlanRequest {
  string region_code = 1;
  int32 age = 2;
  string gender = 3;
  string employment = 4;
  int32 contribution_years = 5;
  double current_balance = 6;
  double monthly_budget = 7;
  string priority = 8;
  double local_avg_salary = 9;
  repeated PolicyParam policies = 10;
}

message PolicyParam {
  string policy_id = 1;
  string calc_method = 2;
  double amount_min = 3;
  double amount_max = 4;
}

message PlanResponse {
  repeated Scheme schemes = 1;
  double calculation_time_ms = 2;
}

message Scheme {
  string name = 1;
  int32 base_salary = 2;
  double monthly_cost = 3;
  double annual_subsidy = 4;
  double projected_pension = 5;
  repeated CashFlowItem cashflow = 6;
}

message CashFlowItem {
  int32 year = 1;
  double payment = 2;
  double subsidy = 3;
  double balance = 4;
}
